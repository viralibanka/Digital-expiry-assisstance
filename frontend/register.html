<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpiryVault - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🛡️ Create Account</h1>

        <p>Create your ExpiryVault account</p>

        <input
            type="text"
            id="full_name"
            placeholder="Full Name">

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="registerUser()">
            Create Account
        </button>

        <p id="message"></p>

        <p class="signup-text">
            Already have an account?
        </p>

        <a href="login.html" class="signup-btn">
            Login
        </a>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
